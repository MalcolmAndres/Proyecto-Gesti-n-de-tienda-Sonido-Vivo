    <!-- 3. BANNER SUPERIOR DE SECCIÓN -->
    <div class="py-4 px-4 text-dark mb-4" style="background: linear-gradient(135deg, cyan 0%, gray 100%); border-bottom: 4px solid #dc2626;">
        <div class="container">
            <nav style="--bs-breadcrumb-divider: '/';" aria-label="breadcrumb">
                <ol class="breadcrumb mb-1 text-muted" style="font-size: 0.85rem;">
                    <li class="breadcrumb-item"><a href="#" class="text-decoration-none text-secondary">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Catálogo</li>
                </ol>
            </nav>
            <h1 class="fw-bold display-5 mb-1">Catálogo de Instrumentos</h1>
            <p class="text-secondary mb-0">Guitarras y otros instrumentos musicales</p>
        </div>
    </div>

    <!-- 4. CONTENEDOR PRINCIPAL: FILTROS + CATÁLOGO -->
    <div class="container-fluid px-4 mb-5">
        
        <!-- Barra de búsqueda interna y ordenamiento -->
        <div class="row mb-4 align-items-center bg-white p-3 rounded shadow-sm">
            <div class="col-md-3">
                <span class="text-secondary fw-semibold" style="font-size: 0.9rem;">EXPLORA EL CATÁLOGO</span>
                <h5 class="fw-bold mb-0">Instrumentos</h5>
            </div>
            <div class="col-md-6 my-2 my-md-0">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" placeholder="Buscar dentro del catálogo">
                    <button class="btn btn-danger" type="button">Buscar</button>
                </div>
            </div>
            <div class="col-md-3 d-flex justify-content-md-end align-items-center gap-3">
                <select class="form-select form-select-sm w-auto">
                    <option selected>Más recientes</option>
                    <option value="1">Menor precio</option>
                    <option value="2">Mayor precio</option>
                </select>
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-secondary btn-sm active"><i class="bi bi-grid-fill"></i></button>
                    <button type="button" class="btn btn-outline-secondary btn-sm"><i class="bi bi-list"></i></button>
                </div>
            </div>
        </div>

        <div class="row">
            
            <!-- COLUMNA IZQUIERDA: LA BARRA LATERAL DE FILTROS -->
            <div class="col-lg-3 col-md-4 mb-4">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    
                    <!-- PRECIO -->
                    <h6 class="fw-bold text-secondary mb-3" style="font-size: 0.85rem; letter-spacing: 0.5px;">PRECIO</h6>
                    <div class="mb-3">
                        <label for="precioDesde" class="form-label text-secondary mb-1" style="font-size: 0.9rem;">Desde</label>
                        <input type="text" class="form-control form-control-sm text-dark fw-medium" id="precioDesde" placeholder="$20.500">
                    </div>
                    <div class="mb-3">
                        <label for="precioHasta" class="form-label text-secondary mb-1" style="font-size: 0.9rem;">Hasta</label>
                        <input type="text" class="form-control form-control-sm text-dark fw-medium" id="precioHasta" placeholder="$1.168.750">
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" value="" id="soloOfertas">
                        <label class="form-check-label text-dark d-flex justify-content-between align-items-center w-100" for="soloOfertas">
                            <span>Solo ofertas</span>
                            <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-2" style="font-size: 0.75rem;">4</span>
                        </label>
                    </div>

                    <!-- DISPONIBILIDAD -->
                    <h6 class="fw-bold text-secondary mb-3 pt-2 border-top" style="font-size: 0.85rem; letter-spacing: 0.5px;">DISPONIBILIDAD</h6>
                    <div class="d-flex flex-column gap-2 mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="disp1">
                            <label class="form-check-label text-dark d-flex justify-content-between align-items-center" for="disp1">
                                <span>A pedido</span>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-2" style="font-size: 0.75rem;">113</span>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="disp2">
                            <label class="form-check-label text-dark d-flex justify-content-between align-items-center" for="disp2">
                                <span>Agotado</span>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-2" style="font-size: 0.75rem;">24</span>
                            </label>
                        </div>
                    </div>

                    <!-- CATEGORÍA -->
                    <h6 class="fw-bold text-secondary mb-3 pt-2 border-top" style="font-size: 0.85rem; letter-spacing: 0.5px;">CATEGORÍA</h6>
                    <div class="d-flex flex-column gap-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="cat1">
                            <label class="form-check-label text-dark d-flex justify-content-between align-items-center" for="cat1">
                                <span>Guitarras Eléctricas</span>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-2" style="font-size: 0.75rem;">127</span>
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="cat2">
                            <label class="form-check-label text-dark d-flex justify-content-between align-items-center" for="cat2">
                                <span>Guitarras Acústicas</span>
                                <span class="badge bg-secondary bg-opacity-10 text-secondary rounded-pill px-2" style="font-size: 0.75rem;">4</span>
                            </label>
                        </div>
                    </div>

                </div>
            </div>

            <!-- COLUMNA DERECHA: LOS PRODUCTOS DINÁMICOS JSON -->
            <div class="col-lg-9 col-md-8">
                <div class="row" id="contenedor-tarjetas">
                </div>
            </div>

        </div>
