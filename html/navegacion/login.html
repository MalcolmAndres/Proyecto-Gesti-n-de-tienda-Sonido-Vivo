    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold text-warning d-flex align-items-center gap-2" href="../../index.html">
                    <img src="../../imagenes/nosotros/logo.png" alt="Logo Sonido Vivo" style="height: 40px; width: auto;" class="object-fit-contain">
                    <span>Sonido Vivo</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center gap-2">
                        <li class="nav-item"><a class="nav-link" href="../../index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
                        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>

                        <li class="nav-item ms-lg-2">

                        </li>
                    </ul>
                </div>
            </div>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center my-5">
        <div class="card p-4 shadow-sm border-0 bg-white w-100" style="max-width: 400px;">
            <h1 class="h3 mb-3 fw-bold text-center">Iniciar Sesión</h1>
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 text-dark fw-bold mb-3">Ingresar</button>
                <p class="text-center small text-muted mb-0">¿No tienes cuenta? <a href="registro.html" class="text-warning fw-bold text-decoration-none">Regístrate aquí</a></p>
            </form>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-auto">
